<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <title>الوقت سيف</title>
  <link rel="stylesheet" href="../shared/base.css">
  <link rel="stylesheet" href="../shared/ui.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="top">
    <div class="brand">
      <img src="../icons/icon.svg" alt="" width="22" height="22">
      <span data-i18n="app.name">الوقت سيف</span>
    </div>
    <div class="top-actions">
      <button id="lang-toggle" type="button" class="ghost lang-mini" data-i18n-title="lang.toggleLabel" data-i18n-aria-label="lang.toggleLabel"><span data-i18n="lang.toggle"></span></button>
      <button id="settings" type="button" class="ghost icon-only" data-i18n-title="pp.openSettings" data-i18n-aria-label="pp.openSettings"><i data-icon="settings"></i></button>
    </div>
  </header>

  <!-- The site in the current tab -->
  <section id="current" class="card hero" hidden>
    <div class="hero-head">
      <span class="avatar" id="current-avatar" aria-hidden="true"></span>
      <div class="hero-title">
        <span class="hero-domain" id="current-domain"></span>
        <span class="muted small" id="current-sub"></span>
      </div>
      <span class="badge" id="current-badge"></span>
    </div>
    <p class="hero-time" id="current-left"></p>
    <div class="bar" id="current-bar" hidden><span></span></div>
    <p class="hero-note muted small" id="current-note" hidden></p>
    <button id="pause" class="pause" type="button" hidden></button>
  </section>

  <section class="card">
    <div class="card-head"><h2 data-i18n="today"></h2><span class="muted small" id="total"></span></div>
    <ul id="rows" class="list usage-list"></ul>
    <p id="empty" class="empty muted small" hidden data-i18n="today.empty"></p>
  </section>

  <footer class="muted small">
    <i data-icon="clock"></i><span id="reset"></span>
  </footer>

  <script type="module" src="../shared/theme.js"></script>
  <script type="module" src="popup.js"></script>
</body>
</html>
